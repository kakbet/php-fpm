name: Build and Push to Harbor

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Without this the workflow can only be reached by a push to main, so a
  # branch could never be built at all — and this image is the BASE that
  # sb/sportsbook-backoffice builds FROM, so it has to be buildable ahead of
  # its consumer.
  workflow_dispatch:

env:
  # The ONE registry since 2026-10-23 (Harbor was added in wave 2 as the second
  # destination). 🔴 ORDER MATTERS AND IT IS ALREADY DONE: this image is a BASE image
  # that other builds pull with `FROM`, so its CONSUMERS had to move first --
  # kakbet/sportsbook-backoffice (three workflows) and kakbet/sportsbook-php-debug
  # (its Dockerfile). Cutting this leg while a consumer still pulled from ECR would
  # have frozen ECR's `:latest` and made that consumer compile against a stale base
  # SILENTLY. Measured before the switch: all 11 tags ECR holds for this image exist
  # in Harbor under the SAME digest; `latest` and `1.0.7` are both
  # sha256:11c1526253cb5f1cae34f8d38c83ecac9a8b8c243f106d4a4eee8b11876d3444.
  HARBOR_REGISTRY: registry.everva.com.tr
  HARBOR_REPOSITORY: sb/sportsbook-php-fpm
  # 🔑 ONE source for the platform list. The build consumes it and so does the
  # verification gate below. Written out twice instead, the two spellings drift
  # the moment somebody edits one of them, and the gate would then be asserting
  # something the build no longer does — a gate that passes while proving
  # nothing. (Measured in a sibling repo: a hand-maintained pair silently lost
  # half its meaning this way.)
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-and-push:
    # 🔴 FORK GUARD. This is the only PR-triggered job in the org that lands on
    # the self-hosted pool, and those runners execute as a uid in the `docker`
    # group on the Harbor host — a fork PR's code would run root-equivalent
    # there. A fork PR must never reach this job.
    #
    # 🪤 NOT the bare `github.event.pull_request.head.repo.full_name ==
    # github.repository`: on `push` and `workflow_dispatch` there is no
    # `pull_request` object, that side evaluates to null, and the ONLY job in
    # this workflow would be skipped — i.e. the bare form silently stops
    # publishing on main and breaks the dispatch builds this repo actually uses.
    # The event_name arm lets non-PR events through untouched.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # The GitHub-hosted pool is billing-blocked on this org: jobs queue and
    # never start. Every sibling repo builds on the self-hosted pool.
    runs-on: [self-hosted, Linux]
    
    permissions:
      contents: write  # Git tag oluşturmak için
      id-token: write  # OIDC için (opsiyonel)
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Tüm git geçmişini çekmek için
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Version Bump
      id: version
      run: |
        # Mevcut versiyonu al
        if git describe --tags --abbrev=0 2>/dev/null; then
          CURRENT_VERSION=$(git describe --tags --abbrev=0)
        else
          CURRENT_VERSION="1.0.0"
        fi
        
        echo "Current version: $CURRENT_VERSION"
        
        # Versiyon parçalarını ayır
        IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
        
        # Patch versiyonunu arttır
        NEW_PATCH=$((PATCH + 1))
        NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
        
        # Etiket çakışması kontrolü
        while git tag -l | grep -q "^${NEW_VERSION}$"; do
          NEW_PATCH=$((NEW_PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
        done
        
        echo "New version: $NEW_VERSION"
        echo "$NEW_VERSION" > VERSION
        
        # Git tag oluştur ve push et
        # 🔴 A release tag is a production name and this workflow is now
        # dispatchable from ANY ref, so off the default branch the tag is
        # neither created nor pushed. The version NUMBER is still produced —
        # the image is tagged with it — but nothing is published.
        if [ "$GITHUB_REF" != "refs/heads/main" ]; then
          echo "::notice::branch run ($GITHUB_REF) — release tag $NEW_VERSION NOT created or pushed."
        else
          git tag "$NEW_VERSION"
          git push origin "$NEW_VERSION"
        fi
        
        # Output olarak ver
        echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

    # 🪤 ORDER: isolate BEFORE buildx. buildx keeps builder state under
    # $DOCKER_CONFIG/buildx; isolate later and the builder lands in the SHARED
    # directory while the build looks in the isolated one.
    # WHY: every runner on this host shares HOME, so one ~/.docker/config.json
    # is shared state between concurrent jobs and amazon-ecr-login's post step
    # DELETES the credentials it wrote — measured in a sibling repo as a
    # `401 Unauthorized` on the push of an already-built image.
    - name: Isolate Docker config for this job
      run: |
        cfg="$RUNNER_TEMP/docker-$GITHUB_RUN_ID-$GITHUB_JOB"
        mkdir -p "$cfg"
        echo '{}' > "$cfg/config.json"
        echo "DOCKER_CONFIG=$cfg" >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Harbor credentials are a REPO secret: this org is on the free plan, where
    # an organization secret does not resolve in a private repository, and the
    # migration keeps one placement rule for every repo rather than two.
    - name: Login to Harbor
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
      with:
        registry: registry.everva.com.tr
        username: ${{ secrets.HARBOR_ROBOT_USER }}
        password: ${{ secrets.HARBOR_ROBOT_TOKEN }}

    - name: Tag fence self-test (scripts/ci/prepare-image-tags.sh)
      # 🔑 The tag fence's own suite, run as a GATE rather than on request. This
      # script is the one door that decides which image names a run may publish, and
      # measured 2026-10-24 its 87 assertions ran in exactly ONE of the 15 repositories
      # that carry it -- every other copy's assertions were claims nobody checked on
      # the way in. The suite is self-contained (`--selftest` builds its own git
      # fixtures under `mktemp -d`) and needs no credentials, no registry, no network.
      # 🪴 `--selftest` exits non-zero when any assertion fails. Measured by
      # mutation: a one-line change to `image_base` turned "87 passed, 0 failed" (rc=0)
      # into "78 passed, 9 failed" (rc=1). So this step IS the assertion and it must
      # never be wrapped in `|| true`.
      run: ./scripts/ci/prepare-image-tags.sh --selftest

    - name: Prepare Tags
      id: tags
      # 🔴 `:latest` was applied unconditionally, and this image is the BASE
      # that sb/sportsbook-backoffice builds FROM (`FROM <base>:latest`), so a
      # branch run here would have changed what the CONSUMER compiles against.
      # The decision now comes from scripts/ci/prepare-image-tags.sh, the same
      # file the sibling repos use.
      # VERSION_SOURCE=allocated: the version step picks this version in THIS
      # run and proves it free, so the already-released guard must not fire on
      # the tag it just created.
      env:
        VERSION_VALUE: ${{ steps.version.outputs.version }}
        VERSION_SOURCE: allocated
        TAG_STYLE: docker-args
        # The registry base every tag is built on. The script used to read the ECR
        # pair; `IMAGE_REGISTRY`/`IMAGE_REPOSITORY` are the registry-neutral names it
        # now prefers (the legacy `ECR_*` pair is still accepted, for the sibling
        # repos whose ECR leg has not been cut yet).
        IMAGE_REGISTRY: ${{ env.HARBOR_REGISTRY }}
        IMAGE_REPOSITORY: ${{ env.HARBOR_REPOSITORY }}
      run: ./scripts/ci/prepare-image-tags.sh >> "$GITHUB_OUTPUT"

    - name: Check the shape of every published tag reference
      id: refs
      # 🔑 The tag DECISION stays where it already is. prepare-image-tags.sh is the
      # one door that decides which names a run may publish, it is shared verbatim
      # with the sibling repos, and it is not touched here. This step re-decides
      # nothing: it TWINS whatever that script allowed, so Harbor can never receive
      # a name the fence refused on ECR and the two registries cannot drift apart.
      # 🔑 WHY THE CSV AND NOT `docker_args`: the script emits `tags=` (comma list)
      # UNCONDITIONALLY and `docker_args=` only as a second spelling of the same
      # decision. Mirroring the CSV and re-deriving the `-t` flags here — with the
      # script's own formatting — keeps ONE parser instead of two, and it is the
      # parser the sibling repos already exercise.
      # 🪤 Fail-closed on shape. A reference that is not exactly
      # `$HARBOR_REGISTRY/$HARBOR_REPOSITORY:<tag>` stops the run instead of being
      # quietly published: a name assembled from an empty or half-expanded variable is
      # a tag nobody can pull. An EMPTY list stops it too.
      # 🪤 2026-10-23: the pairing assertion (ECR_REPOSITORY == HARBOR_REPOSITORY) went
      # with the ECR leg -- there is no second path left to pair -- but what it
      # protected is still protected: every reference is anchored to HARBOR_REPOSITORY
      # below, so this image cannot be published under another image's name.
      env:
        PUBLISHED_TAGS: ${{ steps.tags.outputs.tags }}
        PRIMARY_TAG: ${{ steps.tags.outputs.primary_tag }}
        # Bilerek ikinci el; gerekcesi asagidaki kapida.
        EXPECT_REGISTRY: registry.everva.com.tr
        EXPECT_REPOSITORY: sb/sportsbook-php-fpm
      run: |
        set -euo pipefail
                # 🔑 IKINCI EL -- bu adimin en onemli satiri, ve ne OLMADIGINI da yaziyorum.
        # Eskiden ECR<->Harbor yol esitligi iki BAGIMSIZ degiskeni capraz tutuyordu.
        # ECR yarisi gidince sekil kapisi TOTOLOJIYE dondu: betige `IMAGE_REPOSITORY`
        # olarak beslenen deger ile karsilastirilan deger AYNI degisken oldugu icin kapi
        # yalnizca BOS/yarim-genislemis tabani yakalar, YANLIS AMA IYI-BICIMLI tabani
        # yakalamaz (bagimsiz inceleme bunu kardes bir repoda mutasyonla olctu: depo
        # yolunu baska bir imaja cevirince kapi GECTI).
        # Bu dosyada tek imaj var, yani capraz tutulacak BAGIMSIZ bir ikinci kaynak YOK.
        # Bu yuzden asagidaki `EXPECT_REPOSITORY` bilerek IKINCI BIR ELLE BAKILAN KOPYA
        # -- eski ECR/Harbor cifti de tam olarak buydu. Yakaladigi sey: bir yarida
        # yapilan yazim hatasi ya da yarim birakilmis bir tasima. Yakalamadigi sey:
        # ikisinin birlikte yanlis yazilmasi. Harbor robotu dort projeye push
        # yetkili oldugu icin iyi-bicimli bir yazim hatasi BASKA bir imajin etiketini
        # ezebilir; kapi bunun icin var.
        # 🪤 REGISTRY yarisi da civili. Ilk yazisimda yalniz depo yarisi vardi ve bagimsiz
        # inceleme `HARBOR_REGISTRY`yi baska bir adrese ceviren mutantin HAYATTA KALDIGINI
        # olctu (rc=0). Sonucu yikici degildi -- yanlis registry'de robot kimligi calismaz,
        # login/push duser, yani baska bir mekanizmayla fail-closed -- ama yorum okuyucuya
        # ikinci elin iki yariyi da kapsadigini ima ediyordu. Artik gercekten kapsiyor ve
        # hata GEC degil ERKEN, adiyla geliyor.
        [ -n "${EXPECT_REGISTRY:-}" ]   || { echo "::error::EXPECT_REGISTRY bos"; exit 1; }
        [ -n "${EXPECT_REPOSITORY:-}" ] || { echo "::error::EXPECT_REPOSITORY bos"; exit 1; }
        [ "$HARBOR_REGISTRY" = "$EXPECT_REGISTRY" ] \
          || { echo "::error::HARBOR_REGISTRY='$HARBOR_REGISTRY' beklenen registry '$EXPECT_REGISTRY' ile uyusmuyor; iki yarinin biri yanlis yazilmis"; exit 1; }
        [ "$HARBOR_REPOSITORY" = "$EXPECT_REPOSITORY" ] \
          || { echo "::error::HARBOR_REPOSITORY='$HARBOR_REPOSITORY' beklenen depo '$EXPECT_REPOSITORY' ile uyusmuyor; iki yarinin biri yanlis yazilmis"; exit 1; }
        harbor_base="$HARBOR_REGISTRY/$HARBOR_REPOSITORY"
        [ -n "${PUBLISHED_TAGS:-}" ] || { echo "::error::prepare-image-tags produced no tags"; exit 1; }
        [ -n "${PRIMARY_TAG:-}" ]    || { echo "::error::prepare-image-tags produced no primary_tag"; exit 1; }
        all=""; n=0
        while IFS= read -r ref; do
          [ -n "$ref" ] || continue
          case "$ref" in
            "$harbor_base":?*) : ;;
            *) echo "::error::tag reference is not ${harbor_base}:<tag>: '$ref'"; exit 1 ;;
          esac
          tag="${ref#"$harbor_base":}"
          case "$tag" in
            *:*|*/*) echo "::error::tag component is not a bare tag: '$tag'"; exit 1 ;;
          esac
          all="${all:+$all,}${ref}"
          n=$((n + 1))
        done <<< "$(printf '%s' "$PUBLISHED_TAGS" | tr ',' '\n')"
        [ "$n" -gt 0 ] || { echo "::error::no tag survived the shape check"; exit 1; }
        # Count what was actually built rather than trusting the loop that built it:
        # if the Harbor twin were ever dropped, every check downstream would still
        # pass on the ECR half and the gap would only surface at the digest gate —
        # i.e. AFTER the image had been published to one registry and not the other.
        # Count what came OUT rather than trusting the loop that built it. With the ECR
        # twin gone the expected ratio is 1:1, not 2:1 -- the check stays because a loop
        # that silently drops an entry publishes fewer names than the fence allowed.
        refs_n="$(printf '%s' "$all" | tr ',' '\n' | grep -c .)"
        [ "$refs_n" -eq "$n" ] \
          || { echo "::error::expected $n reference(s) for $n tag(s) but built $refs_n"; exit 1; }
        # `ecr_ref`/`harbor_ref` below are what the verification gates inspect, and
        # they are assembled from PRIMARY_TAG. If that tag is not one this run
        # actually published, those gates would inspect an image this run never
        # pushed: either an older one, which they would wrongly accept, or a missing
        # one, which they would report as a failure whose real cause is here.
        # 🪤 The quotes around the middle of the pattern are a CHECK, not style: an
        # unquoted `$PRIMARY_TAG` is expanded as a glob by `case`, so a primary tag
        # of `*` would match any list and walk straight through this guard.
        case ",$PUBLISHED_TAGS," in
          *",$harbor_base:$PRIMARY_TAG,"*) : ;;
          *) echo "::error::primary_tag '$PRIMARY_TAG' is not among the tags this run published"; exit 1 ;;
        esac
        echo "$n published tag(s) -> $refs_n references:"
        printf '%s' "$all" | tr ',' '\n' | sed 's/^/  /'
        # Same formatting the script uses for docker_args, so the two spellings of
        # one decision cannot drift apart in this shell either.
        dargs="$(printf '%s' "$all" | tr ',' '\n' | sed 's/^/-t /' | tr '\n' ' ' | sed 's/ $//')"
        {
          echo "tags=$all"
          echo "docker_args=$dargs"
          echo "count=$n"
          echo "harbor_ref=${harbor_base}:${PRIMARY_TAG}"
        } >> "$GITHUB_OUTPUT"

    - name: Build and push Docker image
      # 🔴 ONE buildx step replaces `docker build` x2 + `docker push` x2. A
      # multi-architecture build produces a manifest LIST and the local Docker
      # daemon cannot hold one, so the old form would either silently collapse
      # to a single architecture or fail on load. `--push` writes the list
      # straight to the registry, the only place it can live.
      # This image is PHP: the arm64 leg runs its extension builds under QEMU
      # emulation and is materially slower than the amd64 leg — a previous
      # measurement on this host put an arm64 php-fpm build at 44m58s.
      id: build
      run: |
        set -euo pipefail
        # --metadata-file surfaces the pushed manifest digest
        # (containerimage.digest) WITHOUT a second registry round-trip: it is the
        # immutable sha256 of what THIS run pushed. The version tag is mutable and
        # can be re-pushed to a different image, so the digest is the only value
        # that lets the gate below say "the thing in both registries is the thing I
        # just built" instead of merely "both registries have that name".
        meta="$RUNNER_TEMP/build-meta-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}.json"
        docker buildx build \
          --push \
          --platform "$PLATFORMS" \
          --progress=plain \
          --metadata-file "$meta" \
          ${{ steps.refs.outputs.docker_args }} \
          .
        DIGEST="$(jq -r '."containerimage.digest"' "$meta")"
        if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
          echo "::error::could not read containerimage.digest from buildx metadata"
          cat "$meta" || true
          exit 1
        fi
        echo "Pushed digest: $DIGEST"
        echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
        echo "pushed: ${{ steps.refs.outputs.tags }}"

    - name: Verify Harbor serves exactly what this build pushed
      # This REPLACES the older single-registry check rather than sitting beside
      # it. That check asserted the right idea — a multi-arch publish can silently
      # degrade — but it read only the ECR reference and matched with `grep -qF`,
      # which is unanchored: `linux/arm64` is a substring of `linux/arm64/v8`, and
      # the string can also appear in free text outside the `Platform:` field. Two
      # steps making the same claim at different strengths is worse than one, so
      # the weaker spelling is gone and the stronger pair below takes its place.
      #
      # 🪤 `docker buildx imagetools inspect` prints whatever it finds and exits 0,
      # so RUNNING IT IS NOT A VERIFICATION. Every check here ends in an explicit
      # comparison.
      # 🪤 TWO EMPTY STRINGS COMPARE EQUAL: a `--format` that silently produced
      # nothing would sail through a bare equality test, so the sha256 SHAPE gate
      # runs first on each side and is the positive control for the equality gate.
      # 🔑 Anchored to the digest the BUILD produced, not just to agreement between
      # the registries: two references can agree and still both be an older image
      # if this run's push never landed.
      # 🪤 2026-10-23: the cross-registry equality went with the ECR leg. Be exact,
      # because the easy phrasing is wrong: this is NOT stronger than what it replaces.
      # The old step WROTE TWO comparisons (ecr==harbor, ecr==BUILD_DIGEST) which imply
      # a third by transitivity; what survives is the build-vs-registry axis that was
      # ALREADY present. A subset, with no meaningful axis lost -- the axis that is gone
      # (destination vs destination) is the weak one on its own, since the SAME wrong
      # manifest in both registries would have satisfied it.
      env:
        HARBOR_REF: ${{ steps.refs.outputs.harbor_ref }}
        BUILD_DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        set -euo pipefail
        served_digest="$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "$HARBOR_REF" | tr -d '"')"
        echo "pushed by build  -> $BUILD_DIGEST"
        echo "served by Harbor -> $HARBOR_REF -> $served_digest"
        case "$served_digest" in sha256:*) : ;; *) echo "::error::served digest is not a sha256 digest: '$served_digest'"; exit 1 ;; esac
        case "$BUILD_DIGEST"  in sha256:*) : ;; *) echo "::error::build step digest is not a sha256 digest: '$BUILD_DIGEST'"; exit 1 ;; esac
        [ "$served_digest" = "$BUILD_DIGEST" ] \
          || { echo "::error::Harbor serves $served_digest but the build pushed $BUILD_DIGEST"; exit 1; }
        echo "OK: Harbor serves exactly what this build pushed: $served_digest"

    - name: Every requested platform present in Harbor
      # 🔑 `WANT_PLATFORMS` comes from the SAME `env.PLATFORMS` the build consumed,
      # so this gate can only ever assert what was actually requested. A constant
      # repeated here would be a second, independently editable copy — exactly the
      # hand-maintained pair that drifts.
      # 🪤 A BARE `grep -q "linux/amd64"` IS NOT A CHECK: `imagetools inspect`
      # prints free text and the string can appear outside the `Platform:` field.
      # The pattern is anchored to that field and to end-of-line, so
      # `linux/arm64/v8` does not satisfy `linux/arm64` either.
      # 🪤 An empty or whitespace-only list would make both loops no-ops and let
      # this gate pass having compared nothing — rejected BEFORE the loops, so a
      # failing run does not first print `OK:` lines a reader would take at face
      # value.
      env:
        HARBOR_REF: ${{ steps.refs.outputs.harbor_ref }}
        WANT_PLATFORMS: ${{ env.PLATFORMS }}
      run: |
        set -euo pipefail
        IFS=',' read -ra _want <<< "$WANT_PLATFORMS"
        want=()
        for _p in ${_want[@]+"${_want[@]}"}; do
          q="$(printf '%s' "$_p" | tr -d '[:space:]')"
          [ -n "$q" ] && want+=("$q")
        done
        [ "${#want[@]}" -gt 0 ] \
          || { echo "::error::env.PLATFORMS produced no platform to check: '$WANT_PLATFORMS'"; exit 1; }
        # 🪤 This used to loop over "$ECR_REF" "$HARBOR_REF". With one reference left a
        # one-element QUOTED loop is shellcheck SC2066 -- an error, not a style note --
        # so the loop is removed rather than silenced.
        out="$(docker buildx imagetools inspect "$HARBOR_REF")"
        for q in "${want[@]}"; do
          grep -q "Platform:  *$q\$" <<< "$out" \
            || { printf '%s\n' "$out"
                 echo "::error::$HARBOR_REF does not advertise $q"; exit 1; }
        done
        echo "OK: $HARBOR_REF advertises ${want[*]}"

    - name: Update build name
      run: echo "::notice title=Build Complete::Successfully built and pushed version ${{ steps.version.outputs.version }}"